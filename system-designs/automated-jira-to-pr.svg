<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title { font: 700 32px Inter,Arial,sans-serif; fill:#111; }
      .subtitle { font: 500 16px Inter,Arial,sans-serif; fill:#444; }
      .h { font: 700 17px Inter,Arial,sans-serif; fill:#111; }
      .t { font: 14px Inter,Arial,sans-serif; fill:#222; }
      .s { font: 12px Inter,Arial,sans-serif; fill:#444; }
      .box { fill:#fff; stroke:#222; stroke-width:2; rx:14; }
      .soft { fill:#fafafa; stroke:#777; stroke-width:1.5; rx:12; }
      .group { fill:#f7f7f7; stroke:#aaa; stroke-width:1.5; rx:18; stroke-dasharray:7 5; }
      .arrow { stroke:#222; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#555; stroke-width:1.7; fill:none; marker-end:url(#arrow); stroke-dasharray:6 5; }
    </style>
  </defs>

  <text x="60" y="55" class="title">Automated Jira-Ticket-to-PR System</text>
  <text x="60" y="85" class="subtitle">Durable workflow • constrained coding agent • ephemeral sandbox • deterministic validation • draft PR by default</text>

  <!-- Top flow -->
  <rect x="60" y="135" width="180" height="90" class="box"/>
  <text x="150" y="170" text-anchor="middle" class="h">Jira</text>
  <text x="150" y="195" text-anchor="middle" class="t">Ticket + comments</text>
  <text x="150" y="215" text-anchor="middle" class="s">Webhook / Generate PR</text>

  <rect x="300" y="135" width="210" height="90" class="box"/>
  <text x="405" y="168" text-anchor="middle" class="h">Trigger / API</text>
  <text x="405" y="194" text-anchor="middle" class="t">Auth • dedupe • resolve repo</text>
  <text x="405" y="214" text-anchor="middle" class="s">Idempotency-Key</text>

  <rect x="570" y="135" width="220" height="90" class="box"/>
  <text x="680" y="168" text-anchor="middle" class="h">Policy + Eligibility</text>
  <text x="680" y="194" text-anchor="middle" class="t">Risk classify • allowlist</text>
  <text x="680" y="214" text-anchor="middle" class="s">Protected paths • approvals</text>

  <rect x="850" y="125" width="300" height="110" class="box"/>
  <text x="1000" y="162" text-anchor="middle" class="h">Durable Workflow Orchestrator</text>
  <text x="1000" y="190" text-anchor="middle" class="t">Temporal</text>
  <text x="1000" y="213" text-anchor="middle" class="s">Retries • timers • cancellation • human gates</text>

  <path d="M240 180 L300 180" class="arrow"/>
  <path d="M510 180 L570 180" class="arrow"/>
  <path d="M790 180 L850 180" class="arrow"/>

  <!-- Context -->
  <rect x="70" y="310" width="330" height="250" class="group"/>
  <text x="90" y="340" class="h">1. Context Service</text>
  <rect x="95" y="365" width="130" height="70" class="soft"/>
  <text x="160" y="395" text-anchor="middle" class="t">Jira API</text>
  <text x="160" y="417" text-anchor="middle" class="s">criteria / links</text>
  <rect x="245" y="365" width="130" height="70" class="soft"/>
  <text x="310" y="395" text-anchor="middle" class="t">Git Provider</text>
  <text x="310" y="417" text-anchor="middle" class="s">tree / code / history</text>
  <rect x="95" y="460" width="280" height="75" class="soft"/>
  <text x="235" y="490" text-anchor="middle" class="t">Search + Symbol Retrieval</text>
  <text x="235" y="512" text-anchor="middle" class="s">ripgrep • AST/LSP • optional embeddings</text>

  <!-- Agent -->
  <rect x="455" y="310" width="315" height="250" class="group"/>
  <text x="475" y="340" class="h">2. Agent Runtime</text>
  <rect x="480" y="365" width="265" height="55" class="soft"/>
  <text x="612" y="398" text-anchor="middle" class="t">Planner → Executor → Verifier</text>
  <rect x="480" y="440" width="125" height="90" class="soft"/>
  <text x="542" y="470" text-anchor="middle" class="t">LLM Router</text>
  <text x="542" y="493" text-anchor="middle" class="s">small model</text>
  <text x="542" y="511" text-anchor="middle" class="s">coding model</text>
  <rect x="620" y="440" width="125" height="90" class="soft"/>
  <text x="682" y="470" text-anchor="middle" class="t">Tool Broker</text>
  <text x="682" y="493" text-anchor="middle" class="s">policy checks</text>
  <text x="682" y="511" text-anchor="middle" class="s">audit each call</text>

  <!-- Sandbox -->
  <rect x="825" y="300" width="440" height="270" class="group"/>
  <text x="845" y="330" class="h">3. Ephemeral Sandbox</text>
  <text x="845" y="352" class="s">Kubernetes Job + gVisor; Firecracker for higher-risk workloads</text>
  <rect x="850" y="375" width="180" height="70" class="soft"/>
  <text x="940" y="404" text-anchor="middle" class="t">Checkout exact base SHA</text>
  <text x="940" y="426" text-anchor="middle" class="s">isolated writable volume</text>
  <rect x="1055" y="375" width="180" height="70" class="soft"/>
  <text x="1145" y="404" text-anchor="middle" class="t">Edit via patches</text>
  <text x="1145" y="426" text-anchor="middle" class="s">path policy enforced</text>
  <rect x="850" y="470" width="385" height="75" class="soft"/>
  <text x="1042" y="497" text-anchor="middle" class="t">format → lint → typecheck → tests → SAST/secret scan</text>
  <text x="1042" y="520" text-anchor="middle" class="s">bounded repair loop; no default outbound network</text>

  <path d="M1000 235 L1000 275 L235 275 L235 310" class="dash"/>
  <path d="M1000 235 L1000 275 L610 275 L610 310" class="dash"/>
  <path d="M1000 235 L1000 300" class="arrow"/>
  <path d="M400 435 L455 435" class="arrow"/>
  <path d="M770 435 L825 435" class="arrow"/>

  <!-- Publish -->
  <rect x="1320" y="325" width="220" height="205" class="group"/>
  <text x="1340" y="355" class="h">4. Publisher</text>
  <rect x="1345" y="380" width="170" height="58" class="soft"/>
  <text x="1430" y="405" text-anchor="middle" class="t">GitHub App</text>
  <text x="1430" y="425" text-anchor="middle" class="s">short-lived token</text>
  <rect x="1345" y="455" width="170" height="55" class="soft"/>
  <text x="1430" y="480" text-anchor="middle" class="t">Branch + Draft PR</text>
  <text x="1430" y="500" text-anchor="middle" class="s">idempotent publish</text>
  <path d="M1265 435 L1320 435" class="arrow"/>

  <!-- bottom platform -->
  <rect x="70" y="655" width="1470" height="160" class="group"/>
  <text x="90" y="685" class="h">Shared Platform Services</text>

  <rect x="100" y="710" width="190" height="70" class="soft"/>
  <text x="195" y="738" text-anchor="middle" class="t">PostgreSQL</text>
  <text x="195" y="760" text-anchor="middle" class="s">run metadata • uniqueness</text>

  <rect x="315" y="710" width="190" height="70" class="soft"/>
  <text x="410" y="738" text-anchor="middle" class="t">Object Storage</text>
  <text x="410" y="760" text-anchor="middle" class="s">plans • patches • logs</text>

  <rect x="530" y="710" width="190" height="70" class="soft"/>
  <text x="625" y="738" text-anchor="middle" class="t">Secrets Broker</text>
  <text x="625" y="760" text-anchor="middle" class="s">scoped ephemeral creds</text>

  <rect x="745" y="710" width="190" height="70" class="soft"/>
  <text x="840" y="738" text-anchor="middle" class="t">Redis</text>
  <text x="840" y="760" text-anchor="middle" class="s">rate limits • transient cache</text>

  <rect x="960" y="710" width="190" height="70" class="soft"/>
  <text x="1055" y="738" text-anchor="middle" class="t">Kafka / PubSub</text>
  <text x="1055" y="760" text-anchor="middle" class="s">analytics • fan-out events</text>

  <rect x="1175" y="710" width="330" height="70" class="soft"/>
  <text x="1340" y="738" text-anchor="middle" class="t">OpenTelemetry + Audit</text>
  <text x="1340" y="760" text-anchor="middle" class="s">trace Jira → agent → sandbox → PR</text>

  <!-- Deep dive cards -->
  <text x="70" y="870" class="h">Interview deep dives</text>
  <rect x="70" y="895" width="345" height="150" class="box"/>
  <text x="90" y="925" class="h">Durability + Idempotency</text>
  <text x="90" y="952" class="t">• at-least-once execution</text>
  <text x="90" y="976" class="t">• deterministic branch/run markers</text>
  <text x="90" y="1000" class="t">• query before retrying PR creation</text>
  <text x="90" y="1024" class="t">• ticket/base revision drift checks</text>

  <rect x="455" y="895" width="345" height="150" class="box"/>
  <text x="475" y="925" class="h">Security Boundary</text>
  <text x="475" y="952" class="t">• Jira/repo text = untrusted data</text>
  <text x="475" y="976" class="t">• model never grants permissions</text>
  <text x="475" y="1000" class="t">• egress deny + protected paths</text>
  <text x="475" y="1024" class="t">• short-lived GitHub credentials</text>

  <rect x="840" y="895" width="345" height="150" class="box"/>
  <text x="860" y="925" class="h">Quality + Verification</text>
  <text x="860" y="952" class="t">• deterministic tests beat confidence</text>
  <text x="860" y="976" class="t">• bounded repair attempts</text>
  <text x="860" y="1000" class="t">• verifier compares ticket ↔ diff ↔ tests</text>
  <text x="860" y="1024" class="t">• draft PR + human review by default</text>

  <rect x="1225" y="895" width="315" height="150" class="box"/>
  <text x="1245" y="925" class="h">Scale + Cost</text>
  <text x="1245" y="952" class="t">• sandbox/build is main bottleneck</text>
  <text x="1245" y="976" class="t">• cache repo index by commit SHA</text>
  <text x="1245" y="1000" class="t">• model routing + token budgets</text>
  <text x="1245" y="1024" class="t">• per-tenant concurrency controls</text>
</svg>
