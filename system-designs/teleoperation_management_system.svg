<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
  </marker>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill:#111827; }
    .subtitle { font: 400 16px Arial, sans-serif; fill:#4b5563; }
    .section { font: 700 22px Arial, sans-serif; fill:#111827; }
    .boxTitle { font: 700 17px Arial, sans-serif; fill:#111827; }
    .body { font: 400 14px Arial, sans-serif; fill:#1f2937; }
    .small { font: 400 12px Arial, sans-serif; fill:#374151; }
    .mono { font: 400 12px 'Courier New', monospace; fill:#111827; }
    .line { stroke:#374151; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .dash { stroke:#6b7280; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="50" y="55" class="title">Fleet Teleoperation Management System</text>
<text x="50" y="84" class="subtitle">Remote assistance, constrained remote driving, operator assignment, safety controls, auditability, and fleet-scale operations</text>

<rect x="50" y="110" width="1700" height="95" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
<text x="75" y="142" class="section">Scope &amp; assumptions</text>
<text x="75" y="170" class="body">• Default mode is remote assistance: human proposes semantic guidance; onboard autonomy validates and executes.</text>
<text x="75" y="189" class="body">• Direct remote driving is exceptional, geo-fenced, speed-limited, dual-authorized, and fails safe on degraded connectivity.</text>
<text x="75" y="208" class="body">• Vehicle remains the final safety authority. Every command is authenticated, policy-checked, sequenced, recorded, and replayable.</text>
<text x="50" y="245" class="section">High-level architecture and control flow</text>
<rect x="50" y="275" width="350" height="380" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5" filter="url(#shadow)"/>
<text x="75" y="308" class="boxTitle">Autonomous Vehicle / Edge</text>
<text x="75" y="340" class="body">Vehicle Agent</text>
<text x="75" y="360" class="body">• mTLS identity + rotating cert</text>
<text x="75" y="380" class="body">• heartbeat / health / location</text>
<text x="75" y="400" class="body">• request assistance</text>
<text x="75" y="420" class="body"></text>
<text x="75" y="440" class="body">Autonomy &amp; Safety Supervisor</text>
<text x="75" y="460" class="body">• perception / planning</text>
<text x="75" y="480" class="body">• validates remote proposal</text>
<text x="75" y="500" class="body">• speed / geofence / obstacle limits</text>
<text x="75" y="520" class="body">• minimum-risk maneuver on failure</text>
<text x="75" y="540" class="body"></text>
<text x="75" y="560" class="body">Media &amp; Telemetry Gateway</text>
<text x="75" y="580" class="body">• adaptive video bitrate</text>
<text x="75" y="600" class="body">• sensor / CAN summaries</text>
<text x="75" y="620" class="body">• local buffering and sequence IDs</text>
<rect x="455" y="275" width="420" height="380" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
<text x="480" y="308" class="boxTitle">Cloud Control Plane</text>
<text x="480" y="340" class="body">API Gateway + Device Gateway</text>
<text x="480" y="360" class="body">• operator OIDC; vehicle mTLS</text>
<text x="480" y="380" class="body">• authorization, quotas, schema validation</text>
<text x="480" y="400" class="body"></text>
<text x="480" y="420" class="body">Session Orchestrator</text>
<text x="480" y="440" class="body">• state machine + leases</text>
<text x="480" y="460" class="body">• assignment, escalation, cancellation</text>
<text x="480" y="480" class="body"></text>
<text x="480" y="500" class="body">Command Broker</text>
<text x="480" y="520" class="body">• ordered per-session stream</text>
<text x="480" y="540" class="body">• idempotency + acknowledgements</text>
<text x="480" y="560" class="body"></text>
<text x="480" y="580" class="body">Policy / Safety Engine</text>
<text x="480" y="600" class="body">• mode eligibility</text>
<text x="480" y="620" class="body">• region / speed / command constraints</text>
<text x="480" y="640" class="body">• two-person approval for risky actions</text>
<rect x="930" y="275" width="350" height="380" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
<text x="955" y="308" class="boxTitle">Real-time Data Plane</text>
<text x="955" y="340" class="body">Telemetry Bus</text>
<text x="955" y="360" class="body">• Kafka / Pulsar partitions by vehicle</text>
<text x="955" y="380" class="body">• durable operational events</text>
<text x="955" y="400" class="body"></text>
<text x="955" y="420" class="body">Low-latency Session Channel</text>
<text x="955" y="440" class="body">• WebRTC media</text>
<text x="955" y="460" class="body">• QUIC/WebSocket control fallback</text>
<text x="955" y="480" class="body">• congestion and jitter monitoring</text>
<text x="955" y="500" class="body"></text>
<text x="955" y="520" class="body">State Stores</text>
<text x="955" y="540" class="body">• Redis: presence, leases, hot session</text>
<text x="955" y="560" class="body">• Postgres: source of truth</text>
<text x="955" y="580" class="body">• Object storage: video / evidence</text>
<text x="955" y="600" class="body">• Time-series store: telemetry</text>
<rect x="1335" y="275" width="415" height="380" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1360" y="308" class="boxTitle">Teleoperation Control Center</text>
<text x="1360" y="340" class="body">Operator Console</text>
<text x="1360" y="360" class="body">• fleet map + incident queue</text>
<text x="1360" y="380" class="body">• synchronized video / telemetry</text>
<text x="1360" y="400" class="body">• assistance proposal or controls</text>
<text x="1360" y="420" class="body"></text>
<text x="1360" y="440" class="body">Fleet Manager Console</text>
<text x="1360" y="460" class="body">• staffing, queue health, regional load</text>
<text x="1360" y="480" class="body">• override / escalation / incident command</text>
<text x="1360" y="500" class="body"></text>
<text x="1360" y="520" class="body">Operator Services</text>
<text x="1360" y="540" class="body">• skill / certification matching</text>
<text x="1360" y="560" class="body">• fatigue and concurrency limits</text>
<text x="1360" y="580" class="body">• supervisor approval</text>
<text x="1360" y="600" class="body"></text>
<text x="1360" y="620" class="body">Audit &amp; Replay</text>
<text x="1360" y="640" class="body">• immutable session timeline</text>
<text x="1360" y="660" class="body">• command, media, policy decisions</text>
<path d="M400,405 L455,405" class="line"/>
<path d="M875,405 L930,405" class="line"/>
<path d="M1280,405 L1335,405" class="line"/>
<path d="M1335,520 L1280,520" class="dash"/>
<path d="M930,565 L875,565" class="dash"/>
<path d="M455,565 L400,565" class="dash"/>
<text x="405" y="392" class="small">request / telemetry</text>
<text x="1276" y="507" class="small">operator action</text>
<text x="50" y="700" class="section">Session lifecycle</text>
<rect x="50" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="65" y="758" class="boxTitle">DETECTED</text>
<text x="65" y="783" class="small">Vehicle uncertainty</text>
<rect x="265" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="280" y="758" class="boxTitle">QUEUED</text>
<text x="280" y="783" class="small">Priority + SLA</text>
<rect x="480" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="495" y="758" class="boxTitle">ASSIGNED</text>
<text x="495" y="783" class="small">Lease to operator</text>
<rect x="695" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="710" y="758" class="boxTitle">CONNECTED</text>
<text x="710" y="783" class="small">Media + telemetry</text>
<rect x="910" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="925" y="758" class="boxTitle">GUIDANCE</text>
<text x="925" y="783" class="small">Proposal / control</text>
<rect x="1125" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="1140" y="758" class="boxTitle">EXECUTING</text>
<text x="1140" y="783" class="small">Vehicle validates</text>
<rect x="1340" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="1355" y="758" class="boxTitle">RESOLVED</text>
<text x="1355" y="783" class="small">Resume autonomy</text>
<rect x="1555" y="730" width="180" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="1570" y="758" class="boxTitle">CLOSED</text>
<text x="1570" y="783" class="small">Audit complete</text>
<path d="M230,769 L265,769" class="line"/>
<path d="M445,769 L480,769" class="line"/>
<path d="M660,769 L695,769" class="line"/>
<path d="M875,769 L910,769" class="line"/>
<path d="M1090,769 L1125,769" class="line"/>
<path d="M1305,769 L1340,769" class="line"/>
<path d="M1520,769 L1555,769" class="line"/>
<text x="50" y="835" class="body">Failure transitions: any active state → DEGRADED → minimum-risk maneuver; lease expiry → REQUEUE; policy rejection → ESCALATE.</text>
<text x="50" y="885" class="section">Core entities</text>
<rect x="50" y="915" width="315" height="235" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="70" y="947" class="boxTitle">Vehicle</text>
<text x="70" y="977" class="mono">vehicleId, region, capabilities</text>
<text x="70" y="1003" class="mono">operationalState, autonomyMode</text>
<text x="70" y="1029" class="mono">lastLocation, lastHeartbeatAt</text>
<text x="70" y="1055" class="mono">softwareVersion, safetyProfile</text>
<rect x="390" y="915" width="315" height="235" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="410" y="947" class="boxTitle">AssistanceRequest</text>
<text x="410" y="977" class="mono">requestId, vehicleId, reason</text>
<text x="410" y="1003" class="mono">priority, requestedMode</text>
<text x="410" y="1029" class="mono">contextSnapshotRef, createdAt</text>
<text x="410" y="1055" class="mono">status, SLA deadline</text>
<rect x="730" y="915" width="315" height="235" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="750" y="947" class="boxTitle">TeleopSession</text>
<text x="750" y="977" class="mono">sessionId, requestId, operatorId</text>
<text x="750" y="1003" class="mono">mode, state, leaseVersion</text>
<text x="750" y="1029" class="mono">startedAt, endedAt</text>
<text x="750" y="1055" class="mono">policyDecisionId</text>
<rect x="1070" y="915" width="315" height="235" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1090" y="947" class="boxTitle">RemoteOperator</text>
<text x="1090" y="977" class="mono">operatorId, certifications</text>
<text x="1090" y="1003" class="mono">regions, activeSessionCount</text>
<text x="1090" y="1029" class="mono">availability, fatigueScore</text>
<text x="1090" y="1055" class="mono">supervisorId</text>
<rect x="1410" y="915" width="340" height="235" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1430" y="947" class="boxTitle">Command / Event</text>
<text x="1430" y="977" class="mono">commandId, sessionId, sequence</text>
<text x="1430" y="1003" class="mono">type, payloadHash, issuedAt</text>
<text x="1430" y="1029" class="mono">ackState, policyResult</text>
<text x="1430" y="1055" class="mono">eventId, correlationId</text>
<text x="50" y="1200" class="section">API design</text>
<rect x="50" y="1230" width="830" height="225" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="75" y="1260" class="boxTitle">Control-plane REST / gRPC</text>
<text x="75" y="1290" class="mono">POST /v1/assistance-requests                 vehicle opens request; idempotency key required</text>
<text x="75" y="1312" class="mono">GET  /v1/assistance-requests?region=&amp;status= operator queue</text>
<text x="75" y="1334" class="mono">POST /v1/sessions/{id}:claim                 acquire versioned lease</text>
<text x="75" y="1356" class="mono">POST /v1/sessions/{id}:connect               mint short-lived media/control credentials</text>
<text x="75" y="1378" class="mono">POST /v1/sessions/{id}/guidance               submit semantic path/intent proposal</text>
<text x="75" y="1400" class="mono">POST /v1/sessions/{id}/commands               exceptional low-level command; sequence + expiry</text>
<text x="75" y="1422" class="mono">POST /v1/sessions/{id}:resolve|:escalate|:abort explicit state transitions</text>
<text x="75" y="1444" class="mono">GET  /v1/sessions/{id}/timeline               audit and replay metadata</text>
<rect x="920" y="1230" width="830" height="225" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#shadow)"/>
<text x="945" y="1260" class="boxTitle">Key drawbacks, risks, and mitigations</text>
<text x="945" y="1290" class="body">• Network latency/jitter: direct driving becomes unsafe → prefer semantic assistance; edge safety envelope.</text>
<text x="945" y="1312" class="body">• Connectivity loss: stale commands or loss of visibility → command TTL, sequence fencing, automatic safe stop.</text>
<text x="945" y="1334" class="body">• Human scaling: one-to-one teleoperation is expensive → pooled operators, rarity targets, automation feedback loop.</text>
<text x="945" y="1356" class="body">• Operator overload/fatigue: missed hazards → certification, concurrency caps, breaks, supervisor escalation.</text>
<text x="945" y="1378" class="body">• Security compromise: remote vehicle control is high impact → zero trust, mTLS, hardware-backed keys, dual approval.</text>
<text x="945" y="1400" class="body">• Split-brain ownership: two operators issue commands → versioned lease, fencing token, single-writer command stream.</text>
<text x="945" y="1422" class="body">• Audit/privacy cost: video and telemetry are sensitive and expensive → selective retention, redaction, legal holds.</text>
<text x="945" y="1444" class="body">• Cloud outage/common-mode failure → regional isolation, edge autonomy, local minimum-risk maneuver, chaos testing.</text>
<text x="50" y="1482" class="subtitle">Design principle: cloud coordinates; operator advises; onboard safety supervisor authorizes and executes.</text>
</svg>