<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .note { font: 13px Arial, sans-serif; fill: #475569; }
      .line { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .accent { fill: #eef2ff; stroke: #4f46e5; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .red { fill: #fef2f2; stroke: #dc2626; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
    </style>
  </defs>

  <rect width="1500" height="960" fill="#ffffff"/>
  <text x="48" y="48" class="title">GitHub Actions-like Multi-Tenant CI/CD Platform — High-Level Design</text>
  <text x="48" y="76" class="note">Durable workflow engine + fair scheduler + isolated runners + reconnectable log streaming</text>

  <rect x="40" y="115" width="210" height="135" class="box blue"/>
  <text x="65" y="150" class="label">Repo Events</text>
  <text x="65" y="178" class="small">push / PR / tag</text>
  <text x="65" y="200" class="small">manual dispatch</text>
  <text x="65" y="222" class="small">scheduled trigger</text>

  <rect x="305" y="115" width="215" height="135" class="box"/>
  <text x="330" y="150" class="label">Event Ingestion</text>
  <text x="330" y="178" class="small">auth + idempotency</text>
  <text x="330" y="200" class="small">dedupe event id</text>
  <text x="330" y="222" class="small">burst buffering</text>

  <rect x="575" y="115" width="225" height="135" class="box"/>
  <text x="600" y="150" class="label">Workflow Resolver</text>
  <text x="600" y="178" class="small">fetch YAML at SHA</text>
  <text x="600" y="200" class="small">validate + expand DAG</text>
  <text x="600" y="222" class="small">matrix build limits</text>

  <rect x="855" y="115" width="235" height="135" class="box accent"/>
  <text x="880" y="150" class="label">Workflow Engine</text>
  <text x="880" y="178" class="small">run/job/step state</text>
  <text x="880" y="200" class="small">retry + timeout</text>
  <text x="880" y="222" class="small">durable cancellation</text>

  <rect x="1145" y="115" width="250" height="135" class="box orange"/>
  <text x="1170" y="150" class="label">Fair Scheduler</text>
  <text x="1170" y="178" class="small">tenant quotas</text>
  <text x="1170" y="200" class="small">weighted fair queue</text>
  <text x="1170" y="222" class="small">repo/workflow limits</text>

  <path class="line" d="M250 182 L305 182"/>
  <path class="line" d="M520 182 L575 182"/>
  <path class="line" d="M800 182 L855 182"/>
  <path class="line" d="M1090 182 L1145 182"/>

  <rect x="80" y="330" width="350" height="185" class="group"/>
  <text x="105" y="365" class="label">Strongly Consistent State</text>
  <rect x="110" y="390" width="280" height="92" class="box green"/>
  <text x="135" y="422" class="label">Run State DB</text>
  <text x="135" y="450" class="small">runs, jobs, steps</text>
  <text x="135" y="472" class="small">leases, epochs, cancel flags</text>

  <rect x="500" y="330" width="430" height="185" class="group"/>
  <text x="525" y="365" class="label">Runner Control Plane</text>
  <rect x="530" y="390" width="165" height="92" class="box"/>
  <text x="552" y="424" class="label">Assignment</text>
  <text x="552" y="452" class="small">lease CAS</text>
  <text x="552" y="474" class="small">epoch token</text>
  <rect x="735" y="390" width="165" height="92" class="box"/>
  <text x="757" y="424" class="label">Heartbeat</text>
  <text x="757" y="452" class="small">runner liveness</text>
  <text x="757" y="474" class="small">attempt status</text>

  <rect x="1000" y="320" width="390" height="220" class="group"/>
  <text x="1025" y="355" class="label">Isolated Runner Fleet</text>
  <rect x="1030" y="380" width="155" height="120" class="box red"/>
  <text x="1052" y="413" class="label">Linux Runner</text>
  <text x="1052" y="441" class="small">ephemeral VM</text>
  <text x="1052" y="463" class="small">sandbox FS/network</text>
  <text x="1052" y="485" class="small">short-lived token</text>
  <rect x="1210" y="380" width="155" height="120" class="box red"/>
  <text x="1232" y="413" class="label">Mac/Win Runner</text>
  <text x="1232" y="441" class="small">label matching</text>
  <text x="1232" y="463" class="small">secret injection</text>
  <text x="1232" y="485" class="small">destroy after job</text>

  <path class="line" d="M1270 250 L1270 320"/>
  <path class="line" d="M1145 430 L930 430"/>
  <path class="line" d="M1000 430 L930 430"/>
  <path class="dashed" d="M855 220 C650 270, 420 290, 300 390"/>
  <path class="dashed" d="M430 430 L500 430"/>
  <path class="line" d="M900 430 L1000 430"/>

  <rect x="80" y="610" width="380" height="210" class="group"/>
  <text x="105" y="645" class="label">Real-Time Logs</text>
  <rect x="110" y="670" width="140" height="92" class="box"/>
  <text x="132" y="702" class="label">Log Ingest</text>
  <text x="132" y="730" class="small">ordered chunks</text>
  <text x="132" y="752" class="small">redaction</text>
  <rect x="285" y="670" width="140" height="92" class="box green"/>
  <text x="307" y="702" class="label">Log Stream</text>
  <text x="307" y="730" class="small">partition by job</text>
  <text x="307" y="752" class="small">append-only</text>

  <rect x="535" y="610" width="260" height="210" class="group"/>
  <text x="560" y="645" class="label">Live Gateway</text>
  <rect x="575" y="670" width="180" height="92" class="box blue"/>
  <text x="597" y="702" class="label">WebSocket / SSE</text>
  <text x="597" y="730" class="small">tail cache</text>
  <text x="597" y="752" class="small">cursor reconnect</text>

  <rect x="870" y="610" width="230" height="210" class="group"/>
  <text x="895" y="645" class="label">Developer UI</text>
  <rect x="910" y="670" width="150" height="92" class="box blue"/>
  <text x="932" y="702" class="label">Run View</text>
  <text x="932" y="730" class="small">DAG + status</text>
  <text x="932" y="752" class="small">live logs</text>

  <path class="line" d="M1030 500 C760 570, 360 570, 180 670"/>
  <path class="line" d="M250 716 L285 716"/>
  <path class="line" d="M425 716 L575 716"/>
  <path class="line" d="M755 716 L910 716"/>

  <rect x="1165" y="610" width="240" height="210" class="group"/>
  <text x="1190" y="645" class="label">Side Systems</text>
  <rect x="1200" y="670" width="170" height="38" class="box"/>
  <text x="1220" y="695" class="small">Secrets Manager</text>
  <rect x="1200" y="718" width="170" height="38" class="box"/>
  <text x="1220" y="743" class="small">Artifact Store</text>
  <rect x="1200" y="766" width="170" height="38" class="box"/>
  <text x="1220" y="791" class="small">Outbox/Event Bus</text>

  <path class="dashed" d="M1210 500 L1240 670"/>
  <path class="dashed" d="M1085 500 L1200 737"/>
  <path class="dashed" d="M970 250 C1030 410, 1120 690, 1200 785"/>

  <text x="48" y="905" class="note">Critical patterns: durable cancellation, leases + epochs, at-least-once execution, cursor-based logs, hierarchical fair scheduling, ephemeral sandboxed runners.</text>
</svg>
