<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .dark { fill: #0f172a; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .mono { font: 13px Menlo, Consolas, monospace; fill: #d1d5db; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .yellow { fill: #fef9c3; stroke: #ca8a04; }
      .red { fill: #fee2e2; stroke: #dc2626; }
      .blue { fill: #dbeafe; stroke: #2563eb; }
      .pill { rx: 14; }
      .line { stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="900" class="bg"/>
  <text x="48" y="50" class="title">GitHub Actions Run View — Frontend Wireframe</text>
  <text x="48" y="78" class="small">Live DAG status, cancellable workflow, reconnectable log tailing, artifacts, and job metadata</text>

  <rect x="40" y="110" width="1320" height="70" class="panel"/>
  <text x="70" y="145" class="label">Repo: acme/payments-service</text>
  <text x="70" y="168" class="small">Workflow: CI • Branch: main • Commit: abc123 • Actor: khanh</text>
  <rect x="1040" y="130" width="120" height="32" class="yellow pill"/>
  <text x="1068" y="151" class="small">In progress</text>
  <rect x="1175" y="130" width="78" height="32" class="red pill"/>
  <text x="1196" y="151" class="small">Cancel</text>
  <rect x="1265" y="130" width="64" height="32" class="blue pill"/>
  <text x="1285" y="151" class="small">Retry</text>

  <rect x="40" y="210" width="330" height="630" class="panel"/>
  <text x="70" y="245" class="label">Jobs</text>

  <rect x="70" y="270" width="270" height="78" class="green pill"/>
  <text x="94" y="300" class="label">build</text>
  <text x="94" y="323" class="small">success • ubuntu-latest • 2m 10s</text>

  <rect x="70" y="365" width="270" height="78" class="yellow pill"/>
  <text x="94" y="395" class="label">test / node 20</text>
  <text x="94" y="418" class="small">running • step 4/7 • 5m 42s</text>

  <rect x="70" y="460" width="270" height="78" class="yellow pill"/>
  <text x="94" y="490" class="label">test / node 22</text>
  <text x="94" y="513" class="small">queued • waiting for runner</text>

  <rect x="70" y="555" width="270" height="78" class="blue pill"/>
  <text x="94" y="585" class="label">lint</text>
  <text x="94" y="608" class="small">assigned • runner lease epoch 18</text>

  <rect x="70" y="650" width="270" height="78" class="panel"/>
  <text x="94" y="680" class="label">deploy</text>
  <text x="94" y="703" class="small">blocked • needs tests</text>

  <rect x="410" y="210" width="430" height="250" class="panel"/>
  <text x="440" y="245" class="label">Workflow DAG</text>
  <circle cx="510" cy="315" r="32" class="green"/>
  <text x="492" y="320" class="small">build</text>
  <line x1="542" y1="315" x2="625" y2="315" class="line"/>
  <circle cx="665" cy="315" r="38" class="yellow"/>
  <text x="642" y="320" class="small">test</text>
  <line x1="703" y1="315" x2="775" y2="315" class="line"/>
  <circle cx="805" cy="315" r="32" class="panel"/>
  <text x="783" y="320" class="small">deploy</text>
  <text x="440" y="390" class="small">Status is pushed from the live gateway and reconciled with polling fallback.</text>
  <text x="440" y="418" class="small">Each job can expose attempts, runner labels, duration, and artifacts.</text>

  <rect x="875" y="210" width="485" height="250" class="panel"/>
  <text x="905" y="245" class="label">Run Metadata</text>
  <text x="905" y="280" class="small">Run ID: run_123</text>
  <text x="905" y="305" class="small">Attempt: 2</text>
  <text x="905" y="330" class="small">Tenant quota: 84 / 2,000 concurrent jobs</text>
  <text x="905" y="355" class="small">Queue wait: 11s</text>
  <text x="905" y="380" class="small">Log cursor: job_456 offset 981</text>
  <text x="905" y="405" class="small">Artifacts: coverage.html, test-results.zip</text>

  <rect x="410" y="490" width="950" height="350" class="panel"/>
  <rect x="430" y="520" width="910" height="292" class="dark" rx="12"/>
  <text x="450" y="550" class="mono">$ npm test</text>
  <text x="450" y="578" class="mono">✓ packages/api/auth.test.ts</text>
  <text x="450" y="606" class="mono">✓ packages/api/billing.test.ts</text>
  <text x="450" y="634" class="mono">running packages/api/workflow.test.ts...</text>
  <text x="450" y="662" class="mono">[live] chunkOffset=981 byteEnd=1050112</text>
  <text x="450" y="690" class="mono">reconnect token: fromOffset=981</text>
  <text x="450" y="718" class="mono">...</text>
  <text x="450" y="746" class="mono">No dropped bytes: client resumes from last durable cursor.</text>
  <text x="450" y="774" class="mono">█</text>
  <text x="430" y="835" class="small">Log viewer uses WebSocket/SSE. On reconnect, client sends lastSeenOffset and receives missed chunks from durable log storage.</text>
</svg>
