<line x1="1030" y1="205" x2="1110" y2="205" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1070.0" y="197.0" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">prompt + tools</text>
<line x1="1215" y1="275" x2="980" y2="390" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1097.5" y="324.5" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">tool call</text>
<line x1="1030" y1="487" x2="1110" y2="487" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1070.0" y="479.0" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">validated call</text>
<line x1="1275" y1="565" x2="1275" y2="650" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1275.0" y="599.5" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">read/write</text>
<line x1="730" y1="250" x2="660" y2="465" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="695.0" y="349.5" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">retrieve</text>
<line x1="660" y1="500" x2="730" y2="500" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="695.0" y="492.0" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">context</text>
<line x1="1110" y1="520" x2="1030" y2="520" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1070.0" y="512.0" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">tool result</text>
<line x1="880" y1="390" x2="880" y2="320" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)"/><text x="880.0" y="347.0" font-size="15" font-weight="600" text-anchor="middle" fill="#444" font-family="Inter, Arial, sans-serif">result to LLM</text>
<rect x="60" y="620" width="970" height="155" rx="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="85" y="655" font-size="22" font-weight="700" text-anchor="start" fill="#111" font-family="Inter, Arial, sans-serif">Interview rule of thumb</text>
<text x="85" y="690" font-size="18" font-weight="600" text-anchor="start" fill="#111" font-family="Inter, Arial, sans-serif">Static / unstructured knowledge  →  RAG</text>
<text x="85" y="715" font-size="18" font-weight="600" text-anchor="start" fill="#111" font-family="Inter, Arial, sans-serif">Dynamic / transactional data      →  Tools</text>
<text x="85" y="740" font-size="18" font-weight="600" text-anchor="start" fill="#111" font-family="Inter, Arial, sans-serif">Known session / permission state  →  Structured app context</text>
<text x="85" y="765" font-size="18" font-weight="600" text-anchor="start" fill="#111" font-family="Inter, Arial, sans-serif">LLM proposes intent; backend owns authority.</text>
<text x="60" y="835" font-size="24" font-weight="700" text-anchor="start" fill="#111" font-family="Inter, Arial, sans-serif">Code snippets</text>
<rect x="60" y="865" width="470" height="250" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="80" y="895" font-size="17" font-weight="700" text-anchor="start" fill="#ffffff" font-family="monospace">1. LLM-facing tool schema</text>
<text x="80" y="925" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">const tools = [{</text>
<text x="80" y="948" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  name: &quot;get_campaign_performance&quot;,</text>
<text x="80" y="971" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  inputSchema: {</text>
<text x="80" y="994" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    type: &quot;object&quot;,</text>
<text x="80" y="1017" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    properties: { campaignId: { type: &quot;string&quot; } },</text>
<text x="80" y="1040" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    required: [&quot;campaignId&quot;]</text>
<text x="80" y="1063" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  }</text>
<text x="80" y="1086" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">}];</text>
<rect x="565" y="865" width="475" height="250" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="585" y="895" font-size="17" font-weight="700" text-anchor="start" fill="#ffffff" font-family="monospace">2. Controlled execution</text>
<text x="585" y="925" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">async function executeTool(call, ctx) {</text>
<text x="585" y="947" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  validate(call);</text>
<text x="585" y="969" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  authorize(ctx.user, call.name, call.args);</text>
<text x="585" y="991" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  await requireApprovalIfNeeded(call, ctx);</text>
<text x="585" y="1013" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace"></text>
<text x="585" y="1035" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  return toolRegistry[call.name](</text>
<text x="585" y="1057" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    call.args,</text>
<text x="585" y="1079" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    ctx</text>
<text x="585" y="1101" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  );</text>
<text x="585" y="1123" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">}</text>
<rect x="1075" y="865" width="465" height="250" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="1095" y="895" font-size="17" font-weight="700" text-anchor="start" fill="#ffffff" font-family="monospace">3. Agent loop</text>
<text x="1095" y="925" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">while (response.toolCalls?.length) {</text>
<text x="1095" y="947" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  const results = await executeTools(</text>
<text x="1095" y="969" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    response.toolCalls,</text>
<text x="1095" y="991" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    context</text>
<text x="1095" y="1013" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  );</text>
<text x="1095" y="1035" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace"></text>
<text x="1095" y="1057" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  response = await llm.generate({</text>
<text x="1095" y="1079" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    messages: [...messages, response, ...results],</text>
<text x="1095" y="1101" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">    tools</text>
<text x="1095" y="1123" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">  });</text>
<text x="1095" y="1145" font-size="15" font-weight="400" text-anchor="start" fill="#e5e7eb" font-family="monospace">}</text>
<text x="60" y="1150" font-size="18" font-weight="700" text-anchor="start" fill="#333" font-family="Inter, Arial, sans-serif">Key boundary: LLM never gets direct DB/service authority. Tool gateway enforces policy before side effects.</text>
</svg>