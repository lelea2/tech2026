<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #536076; }
      .session { font: 700 23px Arial, sans-serif; fill: #172033; }
      .heading { font: 700 17px Arial, sans-serif; fill: #172033; }
      .body { font: 400 15px Arial, sans-serif; fill: #253047; }
      .small { font: 400 13px Arial, sans-serif; fill: #536076; }
      .box { fill: #ffffff; stroke: #8793a7; stroke-width: 2; rx: 18; }
      .core { fill: #f5f2ff; stroke: #7357c8; stroke-width: 3; rx: 24; }
      .front { fill: #eef7ff; stroke: #377db8; stroke-width: 3; rx: 20; }
      .back { fill: #effaf4; stroke: #3d8b62; stroke-width: 3; rx: 20; }
      .agent { fill: #fff5e8; stroke: #bd7624; stroke-width: 3; rx: 20; }
      .behavior { fill: #fff0f3; stroke: #b84c69; stroke-width: 3; rx: 20; }
      .arrow { stroke: #68758c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8793a7; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#68758c"/>
    </marker>
  </defs>

  <rect width="1600" height="1050" fill="#fafbfe"/>
  <text x="800" y="55" text-anchor="middle" class="title">Adobe Staff Web Engineer — Four-Session Rehearsal Map</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">Frontend depth + backend judgment + safe agentic architecture + staff-level leadership</text>

  <rect x="560" y="120" width="480" height="155" class="core"/>
  <text x="800" y="158" text-anchor="middle" class="session">Core Positioning</text>
  <text x="800" y="190" text-anchor="middle" class="body">Fast, accessible, data-heavy web experiences</text>
  <text x="800" y="216" text-anchor="middle" class="body">Reliable APIs, concurrency, persistence, and operations</text>
  <text x="800" y="242" text-anchor="middle" class="body">Authorized, approved, evaluated agent workflows</text>

  <rect x="60" y="340" width="350" height="440" class="front"/>
  <text x="235" y="380" text-anchor="middle" class="session">Session 1</text>
  <text x="235" y="410" text-anchor="middle" class="heading">Frontend Development</text>
  <text x="90" y="455" class="heading">Rehearse</text>
  <text x="90" y="485" class="body">• Streaming React implementation</text>
  <text x="90" y="512" class="body">• 100K-object frontend problem</text>
  <text x="90" y="539" class="body">• Rendering technology choice</text>
  <text x="90" y="566" class="body">• Accessibility and monitoring</text>
  <text x="90" y="610" class="heading">Deep dives</text>
  <text x="90" y="640" class="body">• Reducer and request state machine</text>
  <text x="90" y="667" class="body">• Abort, retry, stale chunks, dedupe</text>
  <text x="90" y="694" class="body">• DOM vs SVG vs Canvas vs WebGL</text>
  <text x="90" y="721" class="body">• Virtualization and viewport culling</text>
  <text x="90" y="755" class="small">Goal: prove interaction quality at scale</text>

  <rect x="440" y="340" width="350" height="440" class="back"/>
  <text x="615" y="380" text-anchor="middle" class="session">Session 2</text>
  <text x="615" y="410" text-anchor="middle" class="heading">Backend Development</text>
  <text x="470" y="455" class="heading">Rehearse</text>
  <text x="470" y="485" class="body">• Node/TypeScript concurrency</text>
  <text x="470" y="512" class="body">• API and persistence design</text>
  <text x="470" y="539" class="body">• Idempotency and consistency</text>
  <text x="470" y="566" class="body">• Failure handling and backpressure</text>
  <text x="470" y="610" class="heading">Deep dives</text>
  <text x="470" y="640" class="body">• Concurrency vs rate limiting</text>
  <text x="470" y="667" class="body">• Retry budgets and deadlines</text>
  <text x="470" y="694" class="body">• Outbox and workflow execution</text>
  <text x="470" y="721" class="body">• Multi-tenant persistence</text>
  <text x="470" y="755" class="small">Goal: prove correctness under load</text>

  <rect x="820" y="340" width="350" height="440" class="agent"/>
  <text x="995" y="380" text-anchor="middle" class="session">Session 3</text>
  <text x="995" y="410" text-anchor="middle" class="heading">Architecture + Agentic Systems</text>
  <text x="850" y="455" class="heading">Rehearse</text>
  <text x="850" y="485" class="body">• Full agentic architecture</text>
  <text x="850" y="512" class="body">• Tool gateway and workflow engine</text>
  <text x="850" y="539" class="body">• Authorization and approval</text>
  <text x="850" y="566" class="body">• Evaluation and monitoring</text>
  <text x="850" y="610" class="heading">Deep dives</text>
  <text x="850" y="640" class="body">• Identity and tenant isolation</text>
  <text x="850" y="667" class="body">• Typed tools and policy checks</text>
  <text x="850" y="694" class="body">• Human approval for side effects</text>
  <text x="850" y="721" class="body">• Canary, fallback, and rollback</text>
  <text x="850" y="755" class="small">Goal: prove useful and trustworthy AI</text>

  <rect x="1200" y="340" width="340" height="440" class="behavior"/>
  <text x="1370" y="380" text-anchor="middle" class="session">Session 4</text>
  <text x="1370" y="410" text-anchor="middle" class="heading">Hiring Manager + Values</text>
  <text x="1230" y="455" class="heading">Rehearse</text>
  <text x="1230" y="485" class="body">• Six behavioral stories</text>
  <text x="1230" y="512" class="body">• 90-second introduction</text>
  <text x="1230" y="539" class="body">• Two-minute “Why Adobe?”</text>
  <text x="1230" y="566" class="body">• Two questions per interviewer</text>
  <text x="1230" y="610" class="heading">Story themes</text>
  <text x="1230" y="640" class="body">• Model Foundry impact</text>
  <text x="1230" y="667" class="body">• Feature drift and ambiguity</text>
  <text x="1230" y="694" class="body">• Compliance migration</text>
  <text x="1230" y="721" class="body">• Conflict, execution, feedback</text>
  <text x="1230" y="755" class="small">Goal: prove staff-level influence</text>

  <path d="M690 275 C570 305, 350 305, 235 340" class="arrow"/>
  <path d="M760 275 C710 310, 650 310, 615 340" class="arrow"/>
  <path d="M840 275 C885 310, 950 310, 995 340" class="arrow"/>
  <path d="M910 275 C1040 300, 1260 305, 1370 340" class="arrow"/>

  <rect x="170" y="840" width="1260" height="145" class="box"/>
  <text x="800" y="875" text-anchor="middle" class="session">Repeatable Answer Structure</text>
  <text x="220" y="920" class="body">1. Clarify requirements</text>
  <text x="430" y="920" class="body">2. State assumptions</text>
  <text x="625" y="920" class="body">3. Define success metrics</text>
  <text x="865" y="920" class="body">4. Present simple design</text>
  <text x="1080" y="920" class="body">5. Identify failure modes</text>
  <text x="1270" y="920" class="body">6. Close with tradeoffs</text>
  <text x="800" y="958" text-anchor="middle" class="small">Pause after the high-level design and let the interviewer select the deep dive.</text>
</svg>
