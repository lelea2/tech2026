<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Large-scale node-link visualization frontend architecture</title>
  <desc id="desc">Architecture diagram showing snapshot and delta services, synchronization engine, normalized graph store, UI state, workers, WebGL renderer, ordering, replay, and reconnect recovery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #475569; }
      .section { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 15px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 600 13px Inter, Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 2; rx: 16; filter: url(#shadow); }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="70" y="62" class="title">Large-Scale Node-Link Visualization — Frontend Architecture</text>
  <text x="70" y="94" class="subtitle">100K nodes • snapshot + deltas • strict ordering • replay • reconnect • WebGL level of detail</text>

  <!-- Backend sources -->
  <text x="70" y="145" class="section">Graph platform</text>

  <rect x="70" y="170" width="300" height="135" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="205" class="box-title">Snapshot API</text>
  <text x="95" y="234" class="body">• snapshotId</text>
  <text x="95" y="258" class="body">• graphVersion</text>
  <text x="95" y="282" class="body">• lastSequence watermark</text>

  <rect x="70" y="340" width="300" height="145" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="95" y="375" class="box-title">Delta stream</text>
  <text x="95" y="404" class="body">• eventId + sequence</text>
  <text x="95" y="428" class="body">• base/result graph version</text>
  <text x="95" y="452" class="body">• replay by sequence</text>

  <rect x="70" y="520" width="300" height="125" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="95" y="555" class="box-title">Historical graph service</text>
  <text x="95" y="584" class="body">• revisions and snapshots</text>
  <text x="95" y="608" class="body">• server-side graph diff</text>

  <!-- Sync engine -->
  <text x="470" y="145" class="section">Frontend synchronization</text>

  <rect x="450" y="170" width="390" height="315" class="box" fill="#ffffff" stroke="#0f766e"/>
  <text x="480" y="207" class="box-title">Graph Sync Engine</text>

  <rect x="480" y="230" width="150" height="58" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="500" y="255" class="label">Snapshot loader</text>
  <text x="500" y="275" class="small">chunks + checksum</text>

  <rect x="650" y="230" width="160" height="58" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="670" y="255" class="label">Stream client</text>
  <text x="670" y="275" class="small">SSE or WebSocket</text>

  <rect x="480" y="310" width="150" height="70" rx="10" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="500" y="336" class="label">Order buffer</text>
  <text x="500" y="356" class="small">pendingBySequence</text>

  <rect x="650" y="310" width="160" height="70" rx="10" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="670" y="336" class="label">Version validator</text>
  <text x="670" y="356" class="small">baseGraphVersion</text>

  <rect x="480" y="402" width="330" height="54" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="500" y="425" class="label">Recovery controller</text>
  <text x="500" y="445" class="small">replay gap → reconnect → atomic resnapshot</text>

  <!-- canonical store -->
  <text x="930" y="145" class="section">Canonical and derived state</text>

  <rect x="920" y="170" width="600" height="180" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="950" y="207" class="box-title">Normalized Graph Store</text>

  <rect x="950" y="230" width="165" height="82" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="970" y="257" class="label">nodesById</text>
  <text x="970" y="279" class="small">entityVersion</text>
  <text x="970" y="299" class="small">position + metadata</text>

  <rect x="1135" y="230" width="165" height="82" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1155" y="257" class="label">edgesById</text>
  <text x="1155" y="279" class="small">source + target</text>
  <text x="1155" y="299" class="small">entityVersion</text>

  <rect x="1320" y="230" width="170" height="82" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1340" y="257" class="label">Adjacency indexes</text>
  <text x="1340" y="279" class="small">incoming/outgoing</text>
  <text x="1340" y="299" class="small">fast neighborhood</text>

  <!-- arrows source to sync -->
  <path d="M370 238 C405 238, 415 238, 450 238" class="line"/>
  <text x="380" y="223" class="small">snapshot</text>

  <path d="M370 410 C405 410, 415 340, 450 340" class="line"/>
  <text x="382" y="385" class="small">ordered deltas</text>

  <path d="M370 580 C420 580, 410 460, 450 440" class="line dash"/>
  <text x="378" y="555" class="small">revision diff</text>

  <!-- sync to store -->
  <path d="M840 325 C875 325, 885 260, 920 260" class="line"/>
  <text x="850" y="290" class="small">atomic mutations</text>

  <!-- UI and worker layer -->
  <text x="470" y="545" class="section">Product and interaction layer</text>

  <rect x="450" y="570" width="340" height="175" class="box" fill="#ffffff" stroke="#9333ea"/>
  <text x="480" y="607" class="box-title">React UI State</text>
  <text x="480" y="638" class="body">• selected and hovered nodes</text>
  <text x="480" y="664" class="body">• camera and zoom</text>
  <text x="480" y="690" class="body">• filters and search</text>
  <text x="480" y="716" class="body">• revision comparison controls</text>

  <rect x="830" y="570" width="300" height="175" class="box" fill="#ffffff" stroke="#ea580c"/>
  <text x="860" y="607" class="box-title">Web Worker</text>
  <text x="860" y="638" class="body">• clustering</text>
  <text x="860" y="664" class="body">• filtering and indexing</text>
  <text x="860" y="690" class="body">• local layout refinement</text>
  <text x="860" y="716" class="body">• transferable typed arrays</text>

  <rect x="1170" y="570" width="350" height="175" class="box" fill="#ffffff" stroke="#be123c"/>
  <text x="1200" y="607" class="box-title">Render Adapter</text>
  <text x="1200" y="638" class="body">• visible graph projection</text>
  <text x="1200" y="664" class="body">• LOD and edge reduction</text>
  <text x="1200" y="690" class="body">• mutation coalescing</text>
  <text x="1200" y="716" class="body">• typed GPU buffer updates</text>

  <!-- store arrows -->
  <path d="M1050 350 C1020 420, 670 500, 640 570" class="line"/>
  <text x="760" y="472" class="small">selectors</text>

  <path d="M1210 350 C1160 430, 1000 500, 980 570" class="line"/>
  <text x="1080" y="475" class="small">graph arrays</text>

  <path d="M1370 350 C1390 430, 1350 500, 1350 570" class="line"/>
  <text x="1380" y="475" class="small">dirty entities</text>

  <path d="M790 660 C805 660, 815 660, 830 660" class="line"/>
  <text x="790" y="645" class="small">query</text>

  <path d="M1130 660 C1145 660, 1155 660, 1170 660" class="line"/>
  <text x="1135" y="645" class="small">derived view</text>

  <!-- renderer -->
  <text x="470" y="820" class="section">Rendering and interaction</text>

  <rect x="450" y="845" width="520" height="155" class="box" fill="#0f172a" stroke="#0f172a"/>
  <text x="480" y="885" style="font:700 20px Inter,Arial,sans-serif;fill:#fff">WebGL2 Renderer</text>
  <text x="480" y="918" style="font:400 15px Inter,Arial,sans-serif;fill:#cbd5e1">Instanced nodes • batched edges • texture atlas</text>
  <text x="480" y="946" style="font:400 15px Inter,Arial,sans-serif;fill:#cbd5e1">Camera transform • GPU picking • dirty-range updates</text>
  <text x="480" y="974" style="font:400 15px Inter,Arial,sans-serif;fill:#cbd5e1">Far: clusters  |  Medium: nodes  |  Near: details</text>

  <rect x="1020" y="845" width="500" height="155" class="box" fill="#ffffff" stroke="#64748b"/>
  <text x="1050" y="885" class="box-title">Accessible product surface</text>
  <text x="1050" y="918" class="body">• search-first navigation</text>
  <text x="1050" y="946" class="body">• keyboard neighbor traversal</text>
  <text x="1050" y="974" class="body">• details panel and list/table alternative</text>

  <path d="M1345 745 C1330 790, 1000 820, 900 845" class="line"/>
  <text x="1080" y="810" class="small">render mutation batch</text>

  <path d="M620 745 C630 790, 1120 805, 1200 845" class="line dash"/>
  <text x="770" y="790" class="small">selection + accessible summary</text>

  <!-- recovery loop -->
  <path d="M620 485 C620 510, 220 700, 220 485" class="line dash"/>
  <text x="95" y="705" class="label">Recovery loop</text>
  <text x="95" y="729" class="small">1. Detect sequence gap</text>
  <text x="95" y="751" class="small">2. Request replay</text>
  <text x="95" y="773" class="small">3. Reconnect with cursor</text>
  <text x="95" y="795" class="small">4. Resnapshot if expired</text>

  <!-- footer -->
  <text x="70" y="1030" class="small">Ownership: Visualization Platform → renderer and LOD | Graph Platform → snapshot, sequence, replay | Product → semantics, workflows, permissions</text>
</svg>
